<!DOCTYPE html>
<html lang="en">
<style>
  /* 选角屏幕整体美化 */
#char-select-screen {
    position: fixed !important;
    inset: 0;
    z-index: 50;
    display: none; /* 由JS控制显示 */
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 32px 20px;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(circle at 50% 78%, rgba(255, 158, 71, 0.12) 0%, transparent 28%),
      linear-gradient(180deg, #071019 0%, #101f2f 48%, #241c12 100%);
    background-size: cover;
    color: white;
    font-family: Georgia, "Times New Roman", serif;
}

#char-select-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 45%, rgba(255, 213, 140, 0.06) 0%, transparent 32%),
      linear-gradient(180deg, rgba(4, 8, 12, 0.12) 0%, rgba(4, 8, 12, 0.45) 100%);
}

#char-select-screen::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    box-shadow: inset 0 0 140px rgba(0, 0, 0, 0.55);
}

#char-select-screen > :not(.char-select-p5-layer) {
    position: relative;
    z-index: 2;
}

.char-select-p5-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}

.char-select-p5-layer canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
}

#char-select-screen h2 {
    margin-bottom: 18px;
    color: #f6d48f;
    font-size: clamp(2rem, 4vw, 3.4rem);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
}

#difficulty-buttons {
    flex-wrap: wrap;
}

#char-selected-info {
    margin-bottom: 20px;
    color: #d5d0c3;
    background: rgba(13, 18, 22, 0.42);
    border: 1px solid rgba(246, 212, 143, 0.16);
    border-radius: 999px;
    padding: 10px 18px;
    backdrop-filter: blur(8px);
    letter-spacing: 0.04em;
}
.save-btn {
      position: fixed; 
      bottom: 20px;    /* 保持在屏幕底部 */
      right: 20px;     /* ⬅️ 修改这里：改为 right，留一点边距防遮挡 */
      z-index: 50; 
      background: linear-gradient(135deg, rgba(39, 174, 96, 0.85), rgba(30, 130, 76, 0.95)); 
      backdrop-filter: blur(4px); 
      border: 1px solid rgba(255,255,255,0.2); 
      color: white; 
      padding: 10px 20px; 
      border-radius: 12px; 
      cursor: pointer; 
      font-weight: bold; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
      transition: all 0.2s ease; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      letter-spacing: 0.5px;
    }
    /* 悬停和点击动画保持不变 */
    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(39, 174, 96, 0.6);
      border-color: rgba(255,255,255,0.5);
    }
    .save-btn:active {
      transform: translateY(1px);
    }

/* 英雄卡片基础样式 */
.vivid-card {
    position: relative;
    width: min(420px, 44vw);
    min-width: 280px;
    background: linear-gradient(180deg, rgba(10, 18, 24, 0.76), rgba(14, 10, 7, 0.9));
    border: 1px solid rgba(246, 212, 143, 0.18);
    border-radius: 18px;
    padding: 18px;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 18px 36px rgba(0, 0, 0, 0.28);
}

/* 预览容器与背景发光 */
.hero-preview-container {
    width: 140px;
    position: relative;
    margin-bottom: 10px;
}

.hero-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 86px; height: 86px;
    background: radial-gradient(circle, rgba(255, 196, 112, 0.4) 0%, rgba(255, 196, 112, 0.12) 42%, transparent 72%);
    filter: blur(22px);
    z-index: 0;
}

.hero-preview-canvas {
    position: relative;
    z-index: 1;
}


.hero-card-name {
    text-align: center;
    margin-top: 0;
    margin-bottom: 6px;
    width: 100%;
    font-size: 1.2rem;
    color: #f8e6c2;
    letter-spacing: 0.04em;
}

.hero-card-desc {
    font-size: 0.9rem;
    color: #d2c7b2;
    text-align: center;
    min-height: 40px;
    margin-bottom: 10px;
    line-height: 1.45;
}

.hero-card-stats {
    width: 100%;
    display: flex;
    justify-content: space-around;
    font-size: 0.85rem;
    background: rgba(0,0,0,0.3);
    padding: 8px 10px;
    border-radius: 12px;
    color: #f5e7c5;
    border: 1px solid rgba(255, 226, 178, 0.08);
}

/* 选中与悬停效果 */
.vivid-card:hover {
    background: linear-gradient(180deg, rgba(18, 28, 36, 0.84), rgba(20, 14, 10, 0.95));
    transform: translateY(-7px);
    border-color: rgba(246, 212, 143, 0.38);
    box-shadow: 0 22px 38px rgba(0,0,0,0.34);
}

.vivid-card.selected {
    border: 2px solid #f4c96b;
    background: linear-gradient(180deg, rgba(42, 31, 16, 0.86), rgba(18, 12, 7, 0.94));
    box-shadow: 0 0 0 1px rgba(255, 221, 153, 0.12), 0 0 26px rgba(243, 166, 58, 0.28);
}

/* .vivid-card.selected::before {
    content: "✓";
    position: absolute;
    top: 5px; right: 10px;
    color: #00ffcc;
    font-weight: bold;
} */
@media (max-width: 900px) {
    #char-select-screen {
      justify-content: flex-start;
      padding-top: 48px;
      padding-bottom: 32px;
      overflow-y: auto;
    }

    .vivid-card {
      width: min(92vw, 420px);
      min-width: 0;
    }
}
</style>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>For the Treasure - Unified Edition</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
      -webkit-text-size-adjust: 100%; 
      text-size-adjust: 100%; 
    }
    body { 
      background: #1a1a2e; 
      overflow: hidden; 
      font-family: sans-serif; 
      color: white; 
      /* 【新增】禁用浏览器的双击放大、手势缩放等原生行为 */
      touch-action: none; 
      /* 【新增】防止浏览器边缘的回弹和刷新动画 */
      overscroll-behavior: none; 
    }

    #game-canvas { display: block; cursor: grab; }
    .fullscreen { position: fixed; inset: 0; display: none; justify-content: center; align-items: center; flex-direction: column; background: rgba(10, 10, 30, 0.95); z-index: 50; }
    #hero-slots { display: flex; gap: 22px; margin-bottom: 24px; flex-wrap: wrap; justify-content: center; width: min(980px, 92vw); }
    .hero-card { width: 120px; background: #2c2c54; padding: 15px; border-radius: 8px; cursor: pointer; text-align: center; border: 2px solid transparent; }
    .hero-card.selected { border-color: #f39c12; background: #3d3468; }
    .hero-card.vivid-card { width: min(420px, 44vw); min-width: 280px; background: linear-gradient(180deg, rgba(10, 18, 24, 0.76), rgba(14, 10, 7, 0.9)); border: 1px solid rgba(246, 212, 143, 0.18); border-radius: 18px; padding: 18px; backdrop-filter: blur(10px); box-shadow: 0 18px 36px rgba(0, 0, 0, 0.28); }
    .hero-card.vivid-card:hover { background: linear-gradient(180deg, rgba(18, 28, 36, 0.84), rgba(20, 14, 10, 0.95)); transform: translateY(-7px); border-color: rgba(246, 212, 143, 0.38); box-shadow: 0 22px 38px rgba(0,0,0,0.34); }
    .hero-card.vivid-card.selected { border: 2px solid #f4c96b; background: linear-gradient(180deg, rgba(42, 31, 16, 0.86), rgba(18, 12, 7, 0.94)); box-shadow: 0 0 0 1px rgba(255, 221, 153, 0.12), 0 0 26px rgba(243, 166, 58, 0.28); }
    #char-confirm-btn { background: linear-gradient(135deg, #c68834, #7f4d1c); border: 1px solid rgba(255, 226, 178, 0.3); padding: 12px 34px; color: #fff9ef; border-radius: 999px; cursor: pointer; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; box-shadow: 0 18px 38px rgba(0, 0, 0, 0.28); }
    #char-confirm-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .difficulty-btn { width: 120px; background: rgba(17, 25, 31, 0.72); padding: 15px; border-radius: 999px; cursor: pointer; text-align: center; border: 1px solid rgba(246, 212, 143, 0.18); color: #efe4cc; backdrop-filter: blur(8px); }
    .difficulty-btn.selected { border-color: #f4c96b; background: rgba(91, 58, 24, 0.68); box-shadow: 0 0 0 1px rgba(244, 201, 107, 0.12), 0 0 22px rgba(197, 126, 39, 0.22); }

    #party-status-overlay {
      position: fixed;
      top: 80px;
      left: 20px;
      z-index: 30;
      display: none;
      flex-direction: column;
      gap: 12px;
      pointer-events: auto; 
    }
    .hero-status-box {
      background: linear-gradient(145deg, rgba(30, 30, 50, 0.95), rgba(10, 10, 20, 0.98));
      border: 1px solid rgba(255,255,255,0.08);
      border-left: 4px solid #f39c12;
      padding: 12px 18px;
      min-width: 260px; /* 稍微加宽 */
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      border-radius: 10px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer; 
      backdrop-filter: blur(6px);
    }
    .hero-status-box:hover {
    background: linear-gradient(145deg, rgba(40, 40, 65, 0.98), rgba(15, 15, 25, 1));
    transform: translateX(6px) translateY(-2px);
    box-shadow: 0 12px 28px rgba(0,0,0,0.8);
    border-left: 4px solid #f1c40f;
}
.hp-bar-bg { width: 100%; height: 10px; background: rgba(0,0,0,0.6); border-radius: 5px; margin-top: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
.hp-bar-fill { height: 100%; background: linear-gradient(90deg, #2ecc71, #27ae60); transition: width 0.4s ease; box-shadow: 0 0 10px rgba(46,204,113,0.5); }
.hp-text { font-size: 11px; text-align: right; color: #cbd5e1; margin-top: 4px; font-family: monospace; font-weight: bold; }

.stat-detail { 
    font-size: 12px; 
    color: #e2e8f0; 
    margin-top: 10px; 
    display: none; 
    border-top: 1px dashed rgba(255,255,255,0.15); 
    padding-top: 10px; 
    pointer-events: none;
    line-height: 1.5;
}

    #top-progress { position: fixed; top: 0; left: 0; right: 0; display: none; flex-direction: column; align-items: center; padding: 10px 40px 14px; background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(4px); z-index: 20; gap: 6px; }
    #top-progress-header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 700px; }
    #turn-progress-track { position: relative; width: 100%; max-width: 700px; height: 18px; background: #2a2a3a; border-radius: 9px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1); }
    #turn-progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #e67e22, #e74c3c); border-radius: 9px; transition: width 0.4s ease; }
    #turn-progress-bar.critical { background: linear-gradient(90deg, #c92a1f, #8b0000); animation: progress-pulse 0.6s ease-in-out infinite; }
    @keyframes progress-pulse { 0%, 100% { box-shadow: 0 0 10px rgba(255, 0, 0, 0.5); } 50% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.9); } }
    body.screen-flare { animation: screen-flare 0.5s ease-in-out infinite; }
    @keyframes screen-flare { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.4); } }
    #hud { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; background: rgba(0, 0, 0, 0.6); padding: 10px 20px; border-radius: 10px; z-index: 10; gap: 15px; align-items: center; }

    .animate-spin-slow { animation: spin 0.5s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .shake { animation: shake 0.5s ease-in-out; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); } 20%, 40%, 60%, 80% { transform: translateX(5px); } }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #292524; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #57534e; border-radius: 4px; }
    .animate-bounce-short { animation: bounce-short 1s ease-in-out forwards; }
    @keyframes bounce-short { 0%, 100% { transform: translateY(0); opacity: 0; } 20% { transform: translateY(-20px) scale(1.2); opacity: 1; } 80% { opacity: 1; } }
    .shake-effect { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shake { 10%, 90% { transform: translate3d(-3px, 0, 0) rotate(-1deg); } 20%, 80% { transform: translate3d(4px, 0, 0) rotate(1deg); } 30%, 50%, 70% { transform: translate3d(-6px, 0, 0) rotate(-2deg); } 40%, 60% { transform: translate3d(6px, 0, 0) rotate(2deg); } }
    .slash-effect { position: absolute; inset: 0; z-index: 40; border-radius: 0.5rem; pointer-events: none; background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.9) 48%, rgba(220,38,38,0.7) 50%, transparent 55%); background-size: 200% 200%; animation: slash 0.3s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
    @keyframes slash { 0% { background-position: 200% 0; opacity: 0; } 50% { opacity: 1; } 100% { background-position: -50% 100%; opacity: 0; } }
    .heal-effect { position: absolute; inset: 0; z-index: 40; border-radius: 0.5rem; pointer-events: none; background: radial-gradient(circle, rgba(74,222,128,0.5) 0%, transparent 70%); animation: pulse-heal 0.6s ease-out forwards; }
    @keyframes pulse-heal { 0% { transform: scale(0.5); opacity: 0; } 50% { opacity: 1; } 100% { transform: scale(1.2); opacity: 0; } }
    .vivid-card.selected::before { content: "Ready"; position: absolute; top: 5px; right: 10px; color: #f4c96b; font-weight: bold; letter-spacing: 0.08em; text-transform: uppercase; }

    @media (max-width: 900px) {
      #char-select-screen { justify-content: flex-start; padding-top: 48px; padding-bottom: 32px; overflow-y: auto; }
      .vivid-card { width: min(92vw, 420px); min-width: 0; }
    }
  </style>
</head>

<body>
<canvas id="game-canvas"></canvas>

<div id="party-status-overlay"></div>

<div id="top-progress">
  <div id="top-progress-header">
    <span style="color:#f39c12; font-weight:bold;">💀 Find Village</span>
    <span style="color:#aaa;">Turn <span id="turn-progress-text">0/20</span></span>
  </div>
  <div id="turn-progress-track"><div id="turn-progress-bar"></div></div>
</div>

<div id="char-select-screen" class="fullscreen">
  <h2>Select Your Heroes</h2>
  <div id="hero-slots"></div>
  <div id="difficulty-buttons" style="display: flex; gap: 20px; margin-bottom: 20px; justify-content: center;">
    <button class="difficulty-btn">normal</button>
    <button class="difficulty-btn">hell</button>
  </div>
  <div id="char-selected-info">Please select 2 heroes</div>
  <button id="char-confirm-btn" disabled>Start Adventure</button>
</div>



<button id="save-game-btn" class="save-btn">
  <span style="font-size: 1.2em;">💾</span> Save Game
</button>

<div id="map-gen-screen" class="fullscreen"><h2>Building World...</h2></div>

<div id="story-screen" class="fullscreen" style="background: rgba(0,0,0,0.9); justify-content: center; align-items: center; text-align: center;">
  <div style="max-width: 600px; color: white;">
    <h2 id="story-title" style="color: #f39c12; margin-bottom: 20px;">第一章节：黑暗古树</h2>
    <p id="story-text" style="font-size: 18px; line-height: 1.6; margin-bottom: 30px;"></p>
    <button id="story-next-btn" style="background: #e67e22; border: none; color: white; padding: 10px 30px; border-radius: 5px; cursor: pointer;">继续</button>
  </div>
</div>


<div id="hud">
  <span id="movement-points">Action Points: -</span>
  <button id="end-turn-btn" style="background:#e67e22; border:none; color:white; padding:6px 16px; border-radius:4px; cursor:pointer;">End Turn</button>
</div>

<button id="debug-toggle-btn" style="position: fixed; bottom: 20px; left: 20px; z-index: 15; background: #e67e22; border: 2px solid #fff; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;">🐛 Debug: OFF</button>
<div id="react-combat-root" style="display: none; position: fixed; inset: 0; z-index: 100;"></div>

<div id="event-ui" style="position: fixed; inset: 0; display: none; align-items: flex-end; justify-content: center; padding-bottom: 36px; z-index: 200; pointer-events: none; background: rgba(0, 0, 0, 0.5);">
  <div style="position: relative; width: 90%; max-width: 860px; pointer-events: all;">
    <!-- 头像区域 -->
    <div style="position: absolute; top: -88px; left: 40px; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <div id="event-avatar" style="width: 80px; height: 80px; border-radius: 50%; background: #2d3748; border: 3px solid rgba(251,191,36,0.85); display: flex; align-items: center; justify-content: center; font-size: 36px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); overflow: hidden;">📋</div>
      <div id="event-name" style="background: rgba(10,8,6,0.9); border: 1px solid rgba(251,191,36,0.5); border-radius: 6px; padding: 2px 12px; font-family: sans-serif; font-size: 12px; font-weight: 600; color: #fbbf24; white-space: nowrap; letter-spacing: 0.05em;"></div>
    </div>
    
    <!-- 对话框 -->
    <div style="background: rgba(10,8,6,0.93); border: 1px solid rgba(251,191,36,0.3); border-radius: 12px; padding: 26px 36px 20px 168px; min-height: 110px; cursor: pointer;">
      <h3 id="event-title" style="color: #fbbf24; font-size: 16px; font-weight: 600; margin: 0 0 12px 0; letter-spacing: 0.05em;"></h3>
      
      <p id="event-desc" style="font-family: sans-serif; font-size: 15px; color: #f3f4f6; line-height: 1.85; margin: 0 0 14px 0; min-height: 56px; white-space: pre-wrap;"></p>
      
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span id="event-page" style="font-family: sans-serif; font-size: 12px; color: #6b7280;"></span>
        <div id="event-buttons" style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end;"></div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="./main.js"></script>
<script type="text/babel" src="src/ui/CombatUI.js"></script>
</body>
</html>

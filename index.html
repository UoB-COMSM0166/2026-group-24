<!DOCTYPE html>
<html lang="en">
<style>
  /* Character select screen overall beautification */
#char-select-screen {
    position: fixed !important;
    inset: 0;
    z-index: 50;
    display: none; /* Controlled by JavaScript */
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;

    gap: 10px;
    padding: 22px 20px 18px;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(circle at 50% 78%, rgba(255, 158, 71, 0.12) 0%, transparent 28%),
      linear-gradient(180deg, #071019 0%, #101f2f 48%, #241c12 100%);
    background-size: cover;
    color: white;
    font-family: 'Press Start 2P', monospace;
}

#char-select-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 45%, rgba(255, 213, 140, 0.06) 0%, transparent 32%),
      linear-gradient(180deg, rgba(4, 8, 12, 0.12) 0%, rgba(4, 8, 12, 0.45) 100%);
}

#char-select-screen::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    box-shadow: inset 0 0 140px rgba(0, 0, 0, 0.55);
}

#char-select-screen > :not(.char-select-p5-layer) {
    position: relative;
    z-index: 2;
}

.char-select-p5-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}

.char-select-p5-layer canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
}

#char-select-screen h2 {
    margin-bottom: 8px;
    color: #f6d48f;
    font-size: clamp(2rem, 4vw, 3.4rem);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
}

#difficulty-buttons {
    flex-wrap: wrap;
    margin-bottom: 0 !important;
}

#char-action-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 10px;
}

#char-action-row #char-confirm-btn {
    min-width: 210px;
    padding: 14px 28px;
}

#char-selected-info {
    margin-bottom: 0;
    color: #d5d0c3;
    background: rgba(13, 18, 22, 0.42);
    border: 1px solid rgba(246, 212, 143, 0.16);
    border-radius: 999px;
    padding: 10px 18px;
    backdrop-filter: blur(8px);
    letter-spacing: 0.04em;
}
.save-btn {
      position: fixed; 
      bottom: 20px;    /* Keep at bottom of screen */
      right: 20px;     /* Change to right and add margin to prevent blocking */
      z-index: 50; 
      background: linear-gradient(135deg, rgba(39, 174, 96, 0.85), rgba(30, 130, 76, 0.95)); 
      backdrop-filter: blur(4px); 
      border: 1px solid rgba(255,255,255,0.2); 
      color: white; 
      padding: 10px 20px; 
      border-radius: 12px; 
      cursor: pointer; 
      font-weight: bold; 
      font-family: 'Press Start 2P', monospace;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
      transition: all 0.2s ease; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      letter-spacing: 0.5px;
    }
    /* Hover and click animation remains unchanged */
    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(39, 174, 96, 0.6);
      border-color: rgba(255,255,255,0.5);
    }
    .save-btn:active {
      transform: translateY(1px);
    }

/* Hero card base style */
.vivid-card {
    position: relative;
    width: min(420px, 44vw);
    min-width: 280px;
    background: linear-gradient(180deg, rgba(10, 18, 24, 0.76), rgba(14, 10, 7, 0.9));
    border: 1px solid rgba(246, 212, 143, 0.18);
    border-radius: 18px;
    padding: 18px;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 18px 36px rgba(0, 0, 0, 0.28);
}

/* Preview container and background glow */
.hero-preview-container {
    width: 140px;
    position: relative;
    margin-bottom: 10px;
}

.hero-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 86px; height: 86px;
    background: radial-gradient(circle, rgba(255, 196, 112, 0.4) 0%, rgba(255, 196, 112, 0.12) 42%, transparent 72%);
    filter: blur(22px);
    z-index: 0;
}

.hero-preview-canvas {
    position: relative;
    z-index: 1;
}


.hero-card-name {
    text-align: center;
    margin-top: 0;
    margin-bottom: 6px;
    width: 100%;
    font-size: 1.2rem;
    color: #f8e6c2;
    letter-spacing: 0.04em;
}

.hero-card-desc {
    font-size: 0.9rem;
    color: #d2c7b2;
    text-align: center;
    min-height: 40px;
    margin-bottom: 10px;
    line-height: 1.45;
}

.hero-card-stats {
    width: 100%;
    display: flex;
    justify-content: space-around;
    font-size: 0.85rem;
    background: rgba(0,0,0,0.3);
    padding: 8px 10px;
    border-radius: 12px;
    color: #f5e7c5;
    border: 1px solid rgba(255, 226, 178, 0.08);
}

/* Selected and hover effects */
.vivid-card:hover {
    background: linear-gradient(180deg, rgba(18, 28, 36, 0.84), rgba(20, 14, 10, 0.95));
    transform: translateY(-7px);
    border-color: rgba(246, 212, 143, 0.38);
    box-shadow: 0 22px 38px rgba(0,0,0,0.34);
}

.vivid-card.selected {
    border: 2px solid #f4c96b;
    background: linear-gradient(180deg, rgba(42, 31, 16, 0.86), rgba(18, 12, 7, 0.94));
    box-shadow: 0 0 0 1px rgba(255, 221, 153, 0.12), 0 0 26px rgba(243, 166, 58, 0.28);
}

/* .vivid-card.selected::before {
    content: "✓";
    position: absolute;
    top: 5px; right: 10px;

    font-weight: bold;
} */
@media (max-width: 900px) {
    #char-select-screen {
      justify-content: flex-start;
      padding-top: 48px;
      padding-bottom: 32px;
      overflow-y: auto;
    }

    .vivid-card {
      width: min(92vw, 420px);
      min-width: 0;
    }
}
</style>

    #hud { background: linear-gradient(180deg, rgba(29, 22, 15, 0.92), rgba(12, 17, 21, 0.9)); padding: 12px 18px; border-radius: 4px; gap: 16px; border: 2px solid rgba(215, 179, 106, 0.24); box-shadow: 0 0 0 2px rgba(9,8,6,0.74), 0 18px 36px rgba(0,0,0,0.42); backdrop-filter: blur(10px); }
    #movement-points { min-width: 168px; padding: 10px 14px; border-radius: 2px; background: linear-gradient(180deg, rgba(255, 235, 190, 0.07), rgba(0,0,0,0.08)), rgba(16, 21, 25, 0.66); border: 2px solid rgba(215, 179, 106, 0.14); color: var(--ui-ink); font-weight: 700; letter-spacing: 0.04em; text-shadow: 1px 1px 0 rgba(0,0,0,0.55); }
    .map-ui-btn { position: relative; overflow: hidden; background: linear-gradient(180deg, #7d5224 0%, #5e3918 100%); border: 2px solid rgba(242, 215, 154, 0.24); color: #fff4df; border-radius: 2px; cursor: pointer; font-weight: 700; letter-spacing: 0.05em; box-shadow: 0 0 0 2px rgba(20,14,10,0.72), 0 10px 22px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.08); transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, filter 0.2s ease; text-shadow: 1px 1px 0 rgba(0,0,0,0.5); }
    .map-ui-btn::before { content:''; position:absolute; inset:0; background: linear-gradient(180deg, rgba(255,244,223,0.14), transparent 34%); pointer-events:none; }
    .map-ui-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 26px rgba(0,0,0,0.32), 0 0 0 1px rgba(242, 215, 154, 0.1); border-color: rgba(242, 215, 154, 0.42); filter: brightness(1.06); }
    .map-ui-btn:active { transform: translateY(1px); }
    #end-turn-btn { padding: 10px 18px; border-radius: 12px; }
    #save-game-btn { position: fixed !important; right: 22px !important; left: auto !important; bottom: 82px !important; top: auto !important; z-index: 50 !important; background: linear-gradient(180deg, #325d47 0%, #1d3a2f 100%); border: 1px solid rgba(191, 223, 183, 0.2); color: #eef8e7; padding: 12px 20px; border-radius: 14px; box-shadow: 0 14px 30px rgba(0,0,0,0.34); font-family: 'Press Start 2P', monospace; letter-spacing: 0.06em; text-transform: uppercase; }
    #save-game-btn:hover { box-shadow: 0 18px 36px rgba(0,0,0,0.42); border-color: rgba(191, 223, 183, 0.34); }
    #debug-toggle-btn { position: fixed !important; bottom: 22px !important; left: 22px !important; z-index: 15 !important; background: linear-gradient(180deg, #2b3340 0%, #171d26 100%) !important; border: 1px solid rgba(159, 186, 214, 0.24) !important; color: #e5edf7 !important; padding: 10px 16px !important; border-radius: 14px !important; cursor: pointer !important; font-weight: bold !important; font-size: 12px !important; letter-spacing: 0.06em !important; box-shadow: 0 14px 30px rgba(0,0,0,0.32) !important; }
    #debug-toggle-btn:hover { transform: translateY(-2px); box-shadow: 0 18px 34px rgba(0,0,0,0.4) !important; border-color: rgba(159, 186, 214, 0.38) !important; }

    @media (max-width: 900px) {
      #char-select-screen { justify-content: flex-start; padding-top: 24px; padding-bottom: 20px; overflow-y: auto; }
      .vivid-card { width: min(92vw, 420px); min-width: 0; }
      #top-progress { width: calc(100vw - 20px); padding: 10px 12px 14px; }
      #party-status-overlay { left: 10px; top: 54px; max-width: calc(100vw - 20px); }
      .hero-status-box { min-width: 0; width: min(260px, calc(100vw - 20px)); }
      #hud { width: calc(100vw - 24px); justify-content: space-between; }
      #movement-points { min-width: 0; flex: 1; }
    }
    #pause-overlay {
      display: none; position: fixed; inset: 0; z-index: 900;
      background: rgba(6,4,2,0.72); backdrop-filter: blur(4px);
      justify-content: center; align-items: center;
    }
    #pause-overlay.open { display: flex; }
    #pause-menu {
      width: min(360px, 92vw);
      background: linear-gradient(180deg, rgba(255,235,190,0.06) 0%, transparent 22%),
      linear-gradient(160deg, rgba(28,19,12,0.97), rgba(10,14,18,0.98));
      border: 2px solid rgba(215,179,106,0.32); border-radius: 6px;
      box-shadow: 0 0 0 3px rgba(9,8,6,0.8), 0 32px 64px rgba(0,0,0,0.7);
      padding: 34px 30px 28px;
      font-family: 'Press Start 2P', monospace; color: #f8e8c8;
      display: flex; flex-direction: column; gap: 18px;
      animation: pauseIn 0.18s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes pauseIn {
      from { transform: scale(0.92); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
    #pause-menu h2 {
      margin: 0; font-size: 15px; letter-spacing: 0.12em;
      color: #f4c96b; text-align: center;
      text-shadow: 0 0 18px rgba(244,201,107,0.35), 2px 2px 0 #000;
    }
    .pause-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(215,179,106,0.4), transparent);
    }
    .pm-vol-label { font-size: 10px; color: #b8a882; letter-spacing: 0.08em; margin-bottom: 8px; }
    #pause-vol-slider {
      -webkit-appearance: none; width: 100%; height: 8px;
      background: rgba(12,17,22,0.9); border: 1px solid rgba(215,179,106,0.22);
      border-radius: 999px; outline: none; box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
    }
    #pause-vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f4c96b, #b8852a);
      border: 2px solid #000; cursor: pointer; transition: transform 0.1s;
    }
    #pause-vol-slider::-webkit-slider-thumb:hover { transform: scale(1.15); }
    #pause-vol-slider::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f4c96b, #b8852a);
      border: 2px solid #000; cursor: pointer;
    }
    .pm-btn {
      position: relative; overflow: hidden; width: 100%;
      padding: 13px 16px; border-radius: 3px;
      border: 2px solid rgba(215,179,106,0.22);
      background: linear-gradient(180deg, #7d5224 0%, #5e3918 100%);
      color: #fff4df; font-family: 'Press Start 2P', monospace;
      font-size: 11px; letter-spacing: 0.08em; cursor: pointer; text-align: center;
      box-shadow: 0 0 0 2px rgba(20,14,10,0.7), 0 8px 18px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.08);
      transition: transform 0.15s, filter 0.15s, border-color 0.15s;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
    }
    .pm-btn::before {
      content:''; position:absolute; inset:0; pointer-events:none;
      background: linear-gradient(180deg, rgba(255,244,223,0.12), transparent 40%);
    }
    .pm-btn:hover { transform: translateY(-2px); filter: brightness(1.08); border-color: rgba(242,215,154,0.42); }
    .pm-btn:active { transform: translateY(1px); }
    .pm-btn.pm-save { background: linear-gradient(180deg,#325d47,#1d3a2f); border-color:rgba(191,223,183,0.22); color:#eef8e7; }
    .pm-btn.pm-title { background: linear-gradient(180deg,#4a2828,#2e1818); border-color:rgba(220,150,150,0.22); color:#fde8e8; }
  </style>
</head>

<body>
<div id="boot-loading-screen">
  <div class="boot-loading-panel">
    <div class="boot-loading-label">Loading...</div>
    <div class="boot-loading-track">
      <div id="boot-loading-bar" class="boot-loading-bar"></div>
    </div>
    <div class="boot-loading-meta">
      <span id="boot-loading-text" class="boot-loading-status">Preparing assets...</span>
      <span id="boot-loading-percent" class="boot-loading-percent-text">0%</span>
    </div>
  </div>
</div>
<canvas id="game-canvas"></canvas>

<div id="party-status-overlay"></div>

<div id="top-progress">
  <div id="top-progress-header">
    <span style="color:#f39c12; font-weight:bold;">💀 Find Village</span>
    <span style="color:#aaa;">Turn <span id="turn-progress-text">0/20</span></span>
  </div>
  <div id="turn-progress-track"><div id="turn-progress-bar"></div></div>
</div>

<div id="char-select-screen" class="fullscreen">
  <h2>Select Your Heroes</h2>
  <div id="hero-slots"></div>
  <div id="char-action-row">
    <div id="difficulty-buttons" style="display: flex; gap: 20px; justify-content: center;">
      <button class="difficulty-btn">normal</button>
      <button class="difficulty-btn">hell</button>
    </div>
    <button id="char-confirm-btn" disabled>Start Adventure</button>
  </div>
  <div id="char-selected-info">Please select 2 heroes</div>
</div>



<button id="save-game-btn" class="save-btn map-ui-btn">
  <span style="font-size: 1.2em;">💾</span> Save Game
</button>

<div id="map-gen-screen" class="fullscreen"><h2>Building World...</h2></div>

<div id="story-screen" class="fullscreen" style="background: rgba(0,0,0,0.9); justify-content: center; align-items: center; text-align: center; padding: 10px;">
  <div style="max-width: 90vw; color: white; font-family: 'Press Start 2P', monospace; display: flex; flex-direction: column; max-height: 95vh;">
    <h2 id="story-title" style="color: #f39c12; margin-bottom: 10px; font-family: 'Press Start 2P', monospace; font-size: 16px;">Chapter I: Dark Ancient Tree</h2>
    <div id="story-text" style="font-size: 11px; line-height: 1.5; margin-bottom: 10px; font-family: 'Press Start 2P', monospace; padding: 10px; background: rgba(0,0,0,0.6); border: 1px solid rgba(243,166,58,0.4); border-radius: 6px; text-align: left; overflow-y: auto; white-space: pre-wrap; word-wrap: break-word; flex: 1; min-height: 80px;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span id="story-page" style="font-family: 'Press Start 2P', monospace; font-size: 10px; color: #cbd5e1;"></span>
      <button id="story-next-btn" style="background: #e67e22; border: 1px solid #d67416; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: 'Press Start 2P', monospace; font-size: 10px; font-weight: bold;">Continue ></button>
    </div>
  </div>
</div>


<div id="hud">
  <span id="movement-points">Action Points: -</span>
  <button id="end-turn-btn" class="map-ui-btn">End Turn</button>
</div>

<button id="debug-toggle-btn" style="position: fixed; bottom: 20px; left: 20px; z-index: 15; background: #e67e22; border: 2px solid #fff; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px;">🐛 Debug: OFF</button>
<div id="react-combat-root" style="display: none; position: fixed; inset: 0; z-index: 100;"></div>

<div id="event-ui" style="position: fixed; inset: 0; display: none; align-items: flex-end; justify-content: center; padding-bottom: 36px; z-index: 200; pointer-events: none; background: rgba(0, 0, 0, 0.5);">
  <div style="position: relative; width: 90%; max-width: 860px; pointer-events: all;">
    <!-- Avatar area -->
    <div style="position: absolute; top: -88px; left: 40px; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <div id="event-avatar" style="width: 80px; height: 80px; border-radius: 50%; background: #2d3748; border: 3px solid rgba(251,191,36,0.85); display: flex; align-items: center; justify-content: center; font-size: 36px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); overflow: hidden;">📋</div>
      <div id="event-name" style="background: rgba(10,8,6,0.9); border: 1px solid rgba(251,191,36,0.5); border-radius: 6px; padding: 2px 12px; font-family: 'Press Start 2P', monospace; font-size: 12px; font-weight: 600; color: #fbbf24; white-space: nowrap; letter-spacing: 0.05em;"></div>
    </div>
    
    <!-- Dialog box -->
    <div style="background: rgba(10,8,6,0.93); border: 1px solid rgba(251,191,36,0.3); border-radius: 12px; padding: 26px 36px 20px 168px; min-height: 110px; cursor: pointer;">
      <h3 id="event-title" style="color: #fbbf24; font-size: 16px; font-weight: 600; margin: 0 0 12px 0; letter-spacing: 0.05em;"></h3>
      
      <p id="event-desc" style="font-family: 'Press Start 2P', monospace; font-size: 15px; color: #f3f4f6; line-height: 1.85; margin: 0 0 14px 0; min-height: 56px; white-space: pre-wrap;"></p>
      
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span id="event-page" style="font-family: 'Press Start 2P', monospace; font-size: 12px; color: #6b7280;"></span>
        <div id="event-buttons" style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end;"></div>
      </div>
    </div>
  </div>
</div>
<div id="pause-overlay">
  <div id="pause-menu">
    <h2>⏸ PAUSED</h2>
    <div class="pause-divider"></div>
    <button id="pm-save-btn" class="pm-btn pm-save">💾 &nbsp;Save Game</button>

    <div>
      <div class="pm-vol-label">🎵 &nbsp;MUSIC VOLUME</div>
      <input type="range" id="pause-vol-slider" min="0" max="1" step="0.05" value="0.5">
    </div>

    <div class="pause-divider"></div>

    <button id="pm-resume-btn" class="pm-btn">▶ &nbsp;Resume</button>
    <button id="pm-title-btn" class="pm-btn pm-title">🏠 &nbsp;Main Menu</button>

<script type="module" src="./main.js"></script>
  </div>
</div>
<script type="text/babel" src="src/ui/CombatUI.js"></script>
</body>
</html>
